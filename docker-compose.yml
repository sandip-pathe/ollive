services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AUTH_BYPASS=${AUTH_BYPASS:-true}
      - AUTH_INVITE_CODE=${AUTH_INVITE_CODE:-dev}
      - AUTH_SESSION_SECRET=${AUTH_SESSION_SECRET:-dev-session-secret}
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  web:
    image: node:22-alpine
    working_dir: /app/apps/web
    command: sh -c "test -d node_modules/next || npm install --no-audit --no-fund --package-lock=false; npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8001
      - NEXT_PUBLIC_AUTH_BYPASS=true
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - .:/app
      - web_node_modules:/app/apps/web/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  web_node_modules:
